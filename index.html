<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звёздный журнал кружка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;700&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Один мир: ночное небо. Домашние задачи каждого занятия образуют созвездие.
   Слева небо, справа карточка выбранной звезды; ниже отзыв о занятии, звёзды в ожидании, знаки. */
:root{
  color-scheme: dark;
  --sky:#0c1030;
  --sky-2:#171e52;
  --panel:rgba(255,255,255,.055);
  --line:rgba(190,200,255,.16);
  --ink:#eef0ff;
  --muted:#a2abd9;
  --gold:#ffd166;
  --ember:#ff8a5c;
  --display:"Unbounded","Trebuchet MS",sans-serif;
  --body:"Golos Text","Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1200px 700px at 75% -10%,var(--sky-2),transparent 70%),var(--sky);
  color:var(--ink);font:400 17px/1.5 var(--body);min-height:100vh;
}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,44px);font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:500}
h3{font-size:15px;font-weight:500}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.muted{color:var(--muted)}
.small{font-size:15px}
.eyebrow a{color:var(--ink)}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* вход */
.gate{min-height:70vh;display:grid;align-content:center;gap:22px;max-width:560px}
.gate form{display:flex;gap:10px;flex-wrap:wrap}
.gate input{flex:1 1 220px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:18px}
.btn{padding:14px 22px;border-radius:14px;border:0;background:var(--gold);color:#2a2000;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.err{color:var(--ember);min-height:1.5em}

/* шапка ученика */
.top{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.totals{display:flex;gap:26px;flex-wrap:wrap}
.totals div{display:grid}
.totals b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.totals .g b{color:var(--gold)} .totals .e b{color:var(--ember)}
.totals span{font-size:14px;color:var(--muted)}
.demo{border:1px dashed var(--ember);color:var(--ember);border-radius:12px;padding:8px 14px;font-size:14px;margin-bottom:20px;display:inline-block}

.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sky);border-color:var(--ink);font-weight:700}
.tab[disabled]{cursor:default;border-style:dashed;color:var(--muted)}

.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.skybox{border:1px solid var(--line);border-radius:24px;background:radial-gradient(closest-side at 50% 45%,rgba(120,140,255,.14),transparent),rgba(0,0,0,.22);padding:14px 14px 10px}
.skybox header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:4px 8px 0;flex-wrap:wrap}
svg.sky{display:block;width:100%;height:auto}
.star{cursor:pointer;outline:none}
.star text{font:500 15px var(--body);fill:var(--muted);text-anchor:middle}
.star:hover text,.star.sel text{fill:var(--ink)}
.star .ring{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 7;stroke-linecap:round;opacity:0}
.star:hover .ring{opacity:.35}
.star.sel .ring{opacity:.9}
.star:focus-visible .ring{opacity:1;stroke:var(--gold);stroke-dasharray:none}
.halo{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.25}}
@media (prefers-reduced-motion:reduce){.halo{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 8px 4px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:18px;height:18px;flex:none}

.card{border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:22px;display:grid;gap:14px;align-content:start}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid currentColor;width:max-content;max-width:100%}
.chip svg{width:18px;height:18px;flex:none}
.c-self,.c-idea,.c-noexp{color:var(--gold)} .c-try{color:var(--ember)} .c-open{color:var(--muted)}
.cond{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45}
.cond small{display:block;font:500 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.note{font:500 24px/1.25 var(--hand);color:var(--gold)}
.note small{display:block;font:400 13px var(--body);color:var(--muted);margin-bottom:2px}
.note.fix{color:var(--ember)}

.below{margin-top:20px}
.review{margin-bottom:20px;border-color:rgba(255,209,102,.45);background:rgba(255,209,102,.06)}
.review .letter{font-size:28px;max-width:60ch}
.letter{font:500 25px/1.3 var(--hand)}
.letter small{display:block;font:400 13px var(--body);color:var(--muted);margin-top:10px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo button{width:100%;text-align:left;background:transparent;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.todo button:hover{border-color:var(--ink)}
.todo small{display:block;color:var(--muted);font-size:13px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.badge{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:12px}
.badge i{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);font-style:normal;background:var(--gold);color:#2a2000;box-shadow:0 0 22px rgba(255,209,102,.45)}
.badge i{position:relative}
.badge i em{position:absolute;right:-8px;bottom:-4px;background:var(--ink);color:var(--sky);font:700 12px var(--body);font-style:normal;border-radius:999px;padding:1px 6px}
.badge.off{opacity:.55}
.badge.off i{background:transparent;color:var(--muted);border:1px dashed var(--muted);box-shadow:none}
.badge b{display:block;font-size:15px}
.badge span{font-size:13px;color:var(--muted)}
section.block{margin-top:34px}

/* учитель */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
code{font:500 15px ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px}

/* обучение при первом входе */
.tour-block{position:fixed;inset:0;z-index:50}
.tour-spot{position:fixed;z-index:51;border-radius:18px;box-shadow:0 0 0 9999px rgba(5,7,25,.8);outline:2px solid var(--gold);pointer-events:none;transition:all .25s ease}
.tour-tip{position:fixed;z-index:52;width:min(350px,calc(100vw - 24px));background:#1b2260;border:1px solid var(--gold);border-radius:18px;padding:16px 18px;display:grid;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.55);transition:top .25s ease,left .25s ease}
.tour-tip h3{font-size:16px;font-weight:800;color:var(--gold)}
.tour-tip .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tour-tip .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tour-tip .btn{padding:9px 16px;border-radius:12px;font-size:15px}
.tour-tip .skip{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 0;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.tour-spot,.tour-tip{transition:none}}

/* новый знак отличия */
.pop-back{position:fixed;inset:0;z-index:60;background:rgba(5,7,25,.82);display:grid;place-items:center;padding:20px}
.pop{width:min(420px,100%);max-height:100%;overflow:auto;background:#1b2260;border:1px solid var(--gold);border-radius:24px;padding:26px 22px;display:grid;gap:16px;text-align:center;box-shadow:0 0 60px rgba(255,209,102,.25);animation:popin .35s ease}
@keyframes popin{from{transform:scale(.9);opacity:0}}
.pop h2{font-size:22px;font-weight:800;color:var(--gold)}
.pop .badge{text-align:left}
.pop .btn{justify-self:center}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .review .letter{font-size:24px}
  .totals b{font-size:24px}
}
</style>
</head>

const ST = {
  idea: {label:"Красивое решение",       text:"Эта звезда горит ярче остальных.", lit:true},
  self: {label:"Звезда зажжена",         text:"Решено и объяснено.", lit:true},
  noexp:{label:"Верно, ждёт объяснения", text:"Ответ верный! Допиши, почему так, и звезда разгорится в полную силу.", wait:"ответ верный, допиши объяснение"},
  try:  {label:"Смелая попытка",         text:"Идея уже есть, но где-то спряталась ошибка. Найди её и пришли решение ещё раз.", wait:"искра уже есть, найди ошибку"},
  open: {label:"Ещё в пути",             text:"Эту звезду можно зажечь в любой день: пришли своё решение.", wait:"ждёт твоего решения"}
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function starPath(R,r,n=5){
  let d="";
  for(let i=0;i<n*2;i++){
    const a=-Math.PI/2+i*Math.PI/n, q=i%2?r:R;
    d+=(i?"L":"M")+(q*Math.cos(a)).toFixed(1)+" "+(q*Math.sin(a)).toFixed(1);
  }
  return d+"Z";
}
/* звезда рисуется вокруг точки (0,0), потом сдвигается и масштабируется */
function starShape(st){
  if(st==="open")  return `<path d="${starPath(11,5)}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="3 3"/>`;
  if(st==="try")   return `<circle r="14" fill="var(--ember)" opacity=".18"/><path d="${starPath(9,4.6,4)}" fill="var(--ember)"/>`;
  if(st==="noexp") return `<circle r="17" fill="var(--gold)" opacity=".1"/><path d="${starPath(13,5.8)}" fill="var(--gold)" fill-opacity=".22" stroke="var(--gold)" stroke-width="1.6"/>`;
  if(st==="self")  return `<circle r="19" fill="var(--gold)" opacity=".18"/><path d="${starPath(13,5.8)}" fill="var(--gold)"/>`;
  return `<circle class="halo" r="24" fill="var(--gold)" opacity=".35"/>
          <path d="${starPath(25,3,8)}" fill="var(--gold)" opacity=".55"/>
          <path d="${starPath(16,7)}" fill="#fff3c4" stroke="var(--gold)" stroke-width="1.5"/>`;
}
const icon = st => `<svg viewBox="-18 -18 36 36" aria-hidden="true"><g transform="scale(.68)">${starShape(st)}</g></svg>`;

/* расположение звёзд в поле 600×330: мягкий зигзаг, чем меньше звёзд, тем они крупнее */
function layout(n){
  const s = n<=3 ? 1.9 : n<=5 ? 1.5 : n<=7 ? 1.2 : 1;
  const step = n>1 ? Math.min(170, 460/(n-1)) : 0, P=[];
  for(let i=0;i<n;i++) P.push([300+(i-(n-1)/2)*step, 150+(n>1 ? (i%2 ? 38 : -38) : 0)]);
  return {P,s};
}

    <p class="err" role="alert">${msg?esc(msg):""}</p>
  </div>`;
  document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("code").value);});
}
function bindOut(){const o=document.getElementById("out");if(o)o.onclick=e=>{e.preventDefault();go("");};}
function go(raw){
  let code=String(raw||"").trim().toLowerCase().replace(/^#/,"");
  /* принимаем «Ваня 12345», «ваня12345» и «vanya-12345» */
  const flat=x=>String(x).toLowerCase().replace(/[^a-zа-яё0-9]/g,"");
  const digits=c=>c.split("-")[1]||"";
  const hit=DATA.kids.find(k=>flat(code)===flat(k.code)||flat(code)===flat(k.name)+digits(k.code));
  if(hit) code=hit.code; else if(flat(code)===flat(DATA.teacherCode)) code=DATA.teacherCode;
  try{ if(location.hash.slice(1)!==code) history.replaceState(null,"","#"+code); }catch(e){}
  route(code);
}
function route(code){
  if(!code) return gate();
  if(code===DATA.teacherCode) return teacher();
  kid = code===DATA.demoKid.code ? DATA.demoKid : DATA.kids.find(k=>k.code===code);
  if(!kid) return gate("Не получилось. Напиши имя и свои пять цифр, например: Маша 12345.");
  /* открываем последнее занятие, по которому у ученика уже что-то есть */
  lesson=[...DATA.lessons].reverse().find(l=>kid.lessons[l.id])||DATA.lessons[DATA.lessons.length-1]; sel=null; kidView();
  if(!tourSeen(kid.code)) startTour(celebrate); else celebrate();
}
const mark=(k,l,key)=>((k.lessons[l.id]||{}).marks||{})[key]||"open";
function autoCounts(k){
  let first=0,tried=0,full=0,hard=0;
  DATA.lessons.forEach(l=>{
    if(!l.hw.length) return;
    const ms=l.hw.map(t=>mark(k,l,t.k));
    if(ms.some(m=>ST[m].lit)) first=1;
    if(ms.every(m=>m!=="open")) tried++;
    if(ms.every(m=>ST[m].lit)) full++;
    l.hw.forEach((t,i)=>{ if(t.star&&ST[ms[i]].lit) hard++; });
  });
  return {start:DATA.lessons.length?1:0,first,tried,full,hard};
}
function totals(k){
  let lit=0,idea=0,fix=0,open=0;
  DATA.lessons.forEach(l=>l.hw.forEach(t=>{const m=mark(k,l,t.k);
    if(ST[m].lit)lit++; if(m==="idea")idea++; if(m==="noexp"||m==="try")fix++; if(m==="open")open++;}));
  return {lit,idea,fix,open};
}

    <div class="below">
      <div class="card" id="waitbox"><h3>Звёзды, которые ждут</h3>
        ${waiting.length?`<p class="muted small">За эти задачи ты ещё не брался. Пришли решение в любой день.</p>
        <ul class="todo">${waiting.map(li).join("")}</ul>`
        :`<p>Ты попробовал все задачи этого созвездия!</p>`}
        ${fixing.length?`<h3 style="margin-top:8px">Можно разжечь ярче</h3>
        <p class="muted small">Здесь уже есть твоя идея. Осталось найти ошибку или дописать объяснение.</p>
        <ul class="todo">${fixing.map(li).join("")}</ul>`:""}</div>
    </div>
    <section class="block" id="badgebox"><h2>Знаки отличия</h2>
      <p class="muted small" style="margin-top:4px">Одни знаки даёт учитель за то, как ты думаешь. Другие появляются сами, когда загораются звёзды. Один и тот же знак можно получить много раз.</p>
      <div class="badges">${DATA.badges.map(b=>{const c=b.auto?A[b.id]:(kid.badges||[]).filter(x=>x===b.id).length;
        const times=c%10>=2&&c%10<=4&&(c%100<12||c%100>14)?"раза":"раз";
        return `<div class="badge${c?"":" off"}"><i>${esc(b.glyph)}${c>1?`<em>×${c}</em>`:""}</i><div><b>${esc(b.title)}</b><span>${c>1?`Получен ${c} ${times}`:c?"Получен":"Как получить: "+esc(b.how.toLowerCase())}</span></div></div>`;}).join("")}</div>
    </section>`;
  detail();bindOut();
  document.getElementById("help").onclick=e=>{e.preventDefault();startTour();};
  const pick=k=>{sel=k;app.querySelectorAll(".star").forEach(g=>g.classList.toggle("sel",g.dataset.k===k));detail();};
  app.querySelectorAll(".star").forEach(g=>{g.onclick=()=>pick(g.dataset.k);
    g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(g.dataset.k);}};});
  app.querySelectorAll(".todo button").forEach(b=>b.onclick=()=>{pick(b.dataset.k);document.getElementById("detail").scrollIntoView({block:"nearest",behavior:"smooth"});});
  app.querySelectorAll(".tab[data-l]").forEach(b=>b.onclick=()=>{lesson=DATA.lessons.find(l=>l.id==b.dataset.l);sel=null;kidView();});
}
function detail(){
  const t=lesson.hw.find(x=>x.k===sel), m=mark(kid,lesson,t.k);
  let n=((kid.lessons[lesson.id]||{}).notes||{})[t.k];
  if(typeof n==="string") n={note:n};
  n=n||{};
  const head={idea:"Чем решение красиво",self:"Заметка учителя",noexp:"Что нужно дописать",try:"Где спряталась ошибка",open:"Заметка учителя"}[m];
  document.getElementById("detail").innerHTML=`
    <p class="eyebrow">Домашняя задача ${esc(t.k)}${t.star?" · со звёздочкой":""}</p>
    <h2 style="font-size:24px;font-weight:800">${esc(t.name)}</h2>
    <div class="cond"><small>Условие</small>${esc(t.q)}</div>
    <span class="chip c-${m}">${icon(m)}${ST[m].label}</span>
    <p>${ST[m].text}</p>
    ${n.good?`<p class="note"><small>Что уже получилось</small>${esc(n.good)}</p>`:""}
    ${n.note?`<p class="note${m==="try"?" fix":""}"><small>${head}</small>${esc(n.note)}</p>`:""}`;
}
function teacher(){
  const row=k=>{const T=totals(k);return `<tr><td>${esc(k.name)}</td><td><code>${esc(k.code)}</code></td><td>${T.lit}</td><td>${T.idea}</td><td>${T.fix}</td><td>${T.open}</td>
      <td><button class="btn ghost" style="padding:8px 14px" data-c="${esc(k.code)}">Открыть небо</button></td></tr>`;};
  app.innerHTML=`
    <div class="top"><div><p class="eyebrow">Звёздный журнал · учитель · <a href="#" id="out">выйти</a></p><h1>Все ученики</h1></div></div>
    <p class="muted" style="max-width:65ch;margin-bottom:18px">Ребёнок пишет имя и свои пять цифр, например «Ваня 12345». Личная ссылка — это адрес страницы и код после решётки, например <code>#${esc(DATA.kids[0].code)}</code>.</p>
    <div class="tbl"><table><thead><tr><th>Ученик</th><th>Код для входа</th><th>Зажжено</th><th>Красивых</th><th>На доработке</th><th>Не сдано</th><th></th></tr></thead>
    <tbody>${DATA.kids.map(row).join("")}</tbody></table></div>`;
  bindOut();
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>go(b.dataset.c));
}


/* ===================== ОБУЧЕНИЕ ===================== */
const TOUR=[
  {sel:".totals",  title:"Твой счёт",            text:"Здесь видно, сколько звёзд ты зажёг за всё время."},
  {sel:".tabs",    title:"Занятия",              text:"У каждого занятия своё созвездие. Нажми на занятие, чтобы открыть его."},
  {sel:".review",  title:"Отзыв учителя",        text:"Здесь я пишу, как ты поработал на занятии."},
  {sel:"svg.sky",  title:"Созвездие",            text:"Каждая звезда — это домашняя задача. Нажми на любую звезду, чтобы узнать о ней больше."},
  {sel:".legend",  title:"Какие бывают звёзды",  text:"Чем лучше решение, тем ярче звезда. Пунктирная звезда ещё не зажжена."},
  {sel:"#detail",  title:"Карточка задачи",      text:"Тут условие задачи, твой результат и моя заметка к решению."},
  {sel:"#waitbox", title:"Звёзды, которые ждут", text:"За эти задачи ты ещё не брался. Пришли решение, и звезда загорится. Ниже бывают задачи, где осталось исправить ошибку или дописать объяснение."},
  {sel:"#badgebox",title:"Знаки отличия",        text:"Их дают за то, как ты думаешь: за смелую идею, за упорство, за ясное объяснение."}
];
const seenTour={};
function tourSeen(code){
  if(seenTour[code]) return true;
  try{ return localStorage.getItem("zj-tour-v2-"+code)==="1"; }catch(e){ return false; }
}
function markTour(code){
  seenTour[code]=true;
  try{ localStorage.setItem("zj-tour-v2-"+code,"1"); }catch(e){}
}
let tourOpen=false;
function startTour(onDone){
  if(tourOpen) return; tourOpen=true;
  const steps=TOUR.filter(t=>document.querySelector(t.sel));
  const block=document.createElement("div"), spot=document.createElement("div"), tip=document.createElement("div");
  block.className="tour-block"; spot.className="tour-spot"; tip.className="tour-tip";
  tip.setAttribute("role","dialog"); tip.setAttribute("aria-live","polite");
  document.body.append(block,spot,tip);
  let i=0, el=null;
  function place(){
    if(!el) return;
    const r=el.getBoundingClientRect(), pad=8, W=innerWidth, H=innerHeight;
    spot.style.left=(r.left-pad)+"px"; spot.style.top=(r.top-pad)+"px";
    spot.style.width=(r.width+pad*2)+"px"; spot.style.height=(r.height+pad*2)+"px";
    const tw=tip.offsetWidth, th=tip.offsetHeight;
    let top=r.bottom+pad+12;
    if(top+th>H-8) top=r.top-pad-12-th;
    if(top<8) top=H-th-12;
    tip.style.top=Math.max(8,top)+"px";
    tip.style.left=Math.max(12,Math.min(r.left,W-tw-12))+"px";
  }
  function show(){
    const t=steps[i]; el=document.querySelector(t.sel);
    tip.innerHTML=`<h3>${esc(t.title)}</h3><p>${esc(t.text)}</p>
      <div class="row"><span class="n">${i+1} из ${steps.length}</span>
        <span style="display:flex;gap:8px">${i?`<button class="btn ghost" data-a="back" type="button">Назад</button>`:""}
        <button class="btn" data-a="next" type="button">${i<steps.length-1?"Дальше":"Понятно!"}</button></span></div>
      ${i<steps.length-1?`<button class="skip" data-a="skip" type="button">Пропустить обучение</button>`:""}`;
    el.scrollIntoView({block:"center"});
    place();
    tip.querySelector('[data-a="next"]').focus({preventScroll:true});
  }
  function close(){
    block.remove(); spot.remove(); tip.remove();
    removeEventListener("scroll",place,true); removeEventListener("resize",place); removeEventListener("keydown",key);
    tourOpen=false; if(kid) markTour(kid.code);
    scrollTo(0,0);
    if(typeof onDone==="function") onDone();
  }
  function key(e){ if(e.key==="Escape") close(); }
  tip.addEventListener("click",e=>{
    const a=e.target.closest("[data-a]"); if(!a) return;
    if(a.dataset.a==="skip") return close();
    if(a.dataset.a==="back") i--; else i++;
    if(i>=steps.length) return close();
    show();
  });
  addEventListener("scroll",place,true); addEventListener("resize",place); addEventListener("keydown",key);
  show();
}


/* ===================== НОВЫЕ ЗНАКИ ПРИ ВХОДЕ ===================== */
function badgeCounts(k){
  const A=autoCounts(k), c={};
  DATA.badges.forEach(b=>{c[b.id]=b.auto?A[b.id]:(k.badges||[]).filter(x=>x===b.id).length;});
  return c;
}
const seenBadges={};
function celebrate(){
  if(!kid) return;
  const now=badgeCounts(kid), code=kid.code;
  let old=seenBadges[code];
  if(!old){ try{ old=JSON.parse(localStorage.getItem("zj-badges-"+code)||"{}"); }catch(e){ old={}; } }
  const fresh=DATA.badges.filter(b=>now[b.id]>(old[b.id]||0));
  const save=()=>{ seenBadges[code]=now; try{ localStorage.setItem("zj-badges-"+code,JSON.stringify(now)); }catch(e){} };
  if(!fresh.length) return save();
  const back=document.createElement("div"); back.className="pop-back";
  back.innerHTML=`<div class="pop" role="dialog" aria-label="Новые знаки отличия">
    <p class="eyebrow">Поздравляю!</p>
    <h2>${fresh.length>1?"У тебя новые знаки отличия":"У тебя новый знак отличия"}</h2>
    ${fresh.map(b=>`<div class="badge"><i>${esc(b.glyph)}${now[b.id]>1?`<em>×${now[b.id]}</em>`:""}</i><div><b>${esc(b.title)}</b><span>${esc(b.how)}</span></div></div>`).join("")}
    <button class="btn" type="button">Здорово!</button></div>`;
  document.body.append(back);
  const close=()=>{ back.remove(); save(); removeEventListener("keydown",key); };
  const key=e=>{ if(e.key==="Escape") close(); };
  back.querySelector("button").onclick=close;
  back.onclick=e=>{ if(e.target===back) close(); };
  addEventListener("keydown",key);
  back.querySelector("button").focus();
}

/* фоновые звёзды */
(function(){
  const c=document.getElementById("dust"),x=c.getContext("2d");
  function draw(){
    const w=c.width=innerWidth,h=c.height=innerHeight;let s=7;
    const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
    for(let i=0;i<170;i++){x.globalAlpha=.15+rnd()*.55;x.fillStyle=rnd()>.85?"#ffd166":"#dfe4ff";
      x.beginPath();x.arc(rnd()*w,rnd()*h,.4+rnd()*1.2,0,7);x.fill();}
  }
  draw();addEventListener("resize",draw);
})();

route(location.hash.slice(1).toLowerCase());
